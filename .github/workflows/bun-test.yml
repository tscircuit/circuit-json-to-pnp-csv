# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test packed install with current Circuit JSON
        run: |
          bun run build
          consumer_dir=$(mktemp -d)
          npm pack --pack-destination "$consumer_dir"
          cp tests/assets/nine-key-keyboard.json "$consumer_dir/circuit.json"
          cd "$consumer_dir"
          npm install ./circuit-json-to-pnp-csv-*.tgz circuit-json@0.0.520
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { readFileSync } from "node:fs"
          import { convertCircuitJsonToPickAndPlaceRows } from "circuit-json-to-pnp-csv"
          const circuit = JSON.parse(readFileSync("circuit.json", "utf8"))
          assert.equal(convertCircuitJsonToPickAndPlaceRows(circuit).length, 28)
          JS
